# https://docs.github.com/en/free-pro-team@latest/actions/reference/workflow-syntax-for-github-actions
name: Deploy and Publish

# https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions
on:
  push:
    branches:
      - 'main'

jobs:
  deploy-and-publish:
    # Can switch to ubuntu-latest but self-hosted is safer and faster
    name: Deploy and Publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC
      contents: write # Required for tags and releases
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          fetch-depth: '0'

      - name: Configure git for tagging
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: extractions/setup-just@v1
        with:
          just-version: '1.46.0'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v3
        with:
          node-version: 23.x

      - name: Ensure npm >= 11.7.0
        run: npm install -g npm@^11.7.0

      - uses: denoland/setup-deno@v2
        with:
          deno-version: '2.7.13'

      - name: publish module
        id: publish
        run: |
          set -euo pipefail

          # Capture version before publishing
          VERSION=$(jq -r '.version' lib/package.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # `tee` rather than `OUTPUT=$(...)` so the log streams live, and no
          # `|| true`: a failing publish MUST fail the job. It used to be
          # swallowed, so a broken publish (e.g. a missing tool in the recipe)
          # reported success, silently skipped the release, and left the version
          # unpublished with a green check mark.
          if ! just lib/publish 2>&1 | tee publish.log; then
            echo "::error::'just lib/publish' failed - see the log above"
            exit 1
          fi

          # Publishing is idempotent: an already-published version is a no-op,
          # not a failure, and must not cut a duplicate release.
          if grep -q "PUBLISHING npm version" publish.log; then
            echo "published=true" >> $GITHUB_OUTPUT
          else
            echo "published=false" >> $GITHUB_OUTPUT
          fi

      # Belt and braces: the step above can only report what the recipe told it.
      # This asserts the actual end state against the registry, so any future
      # way of failing quietly still turns the job red.
      - name: verify version is on npm
        run: |
          set -euo pipefail
          NAME=$(jq -r '.name' lib/package.json)
          VERSION="${{ steps.publish.outputs.version }}"

          # Registry reads can lag a publish, and `--prefer-online` is the
          # point of this loop: without it npm answers every attempt from the
          # packument it cached on the first one, so retrying re-reads the same
          # stale "not found" for the life of the cache entry and the whole
          # window is wasted. That is how 1.10.15 - published, tagged and on
          # the registry - was reported missing and failed the job.
          # 12 x 15s, because a cold publish has taken over a minute to appear.
          for attempt in $(seq 1 12); do
            if npm view --prefer-online "$NAME@$VERSION" version > /dev/null 2>&1; then
              echo "✅ $NAME@$VERSION is on npm"
              exit 0
            fi
            echo "$NAME@$VERSION not visible yet (attempt $attempt/12), retrying..."
            sleep 15
          done

          echo "::error::$NAME@$VERSION is not on npm after the publish step"
          exit 1

      # Gated on the tag, not on `published`. Publishing is idempotent, so a
      # re-run after anything later in the job failed finds the version already
      # on npm, publishes nothing, reports published=false - and the release for
      # that version was then lost for good, because no later run can ever
      # satisfy the old condition. That happened to v1.10.15. The tag is what
      # says "this version shipped", so release whatever is tagged and has no
      # release yet, which makes the step safe to re-run and self-healing.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.publish.outputs.version }}"

          git fetch --tags --quiet origin
          if ! git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null; then
            echo "No tag v$VERSION: nothing shipped, nothing to release"
            exit 0
          fi

          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "Release v$VERSION already exists"
            exit 0
          fi

          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --generate-notes \
            --verify-tag

      - name: deploy worker
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
        run: just worker/deploy
