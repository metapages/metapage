# https://docs.github.com/en/free-pro-team@latest/actions/reference/workflow-syntax-for-github-actions
name: Publish

# The tag is the release. `just release` (root justfile) bumps
# lib/package.json, rolls the changelog, commits and pushes `vX.Y.Z`; this
# workflow is the only thing that publishes.
#
# Do not rename this file. npm Trusted Publishing is configured on npmjs.com
# against a specific repository *and workflow filename* - a rename makes the
# OIDC exchange fail and the publish lose its right to push to the registry.
#
# Nothing in here mutates the repo: the version, the docs and the tag were all
# decided before the push, so every step is safe to re-run. If a release fails
# halfway, re-run the workflow run - do not cut a new tag.
on:
  push:
    tags:
      - 'v*'

jobs:
  # The gate. Tag pushes do not match test.yml / format.yml (they filter on
  # branches), so without this a release would run no tests at all.
  test:
    name: Test
    # Self-hosted: the browser E2E suites (playwright for lib, astral for the
    # worker, plus mkcert) are known-good there, which is where test.yml runs
    # them too. A release that cannot be tested must not publish.
    runs-on: [self-hosted]
    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          fetch-depth: '0'

      - name: formatting
        run: just lib/fmt-check

      - name: typescript
        run: just check

      - name: tests
        run: just test

  publish:
    name: Publish
    needs: test
    # ubuntu-latest, not self-hosted: this job holds the OIDC token that
    # publishes to npm, so it runs on a disposable GitHub-hosted runner.
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC (trusted publishing + provenance)
      contents: write # Required for the GitHub release
    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          fetch-depth: '0'

      - uses: extractions/setup-just@v1
        with:
          just-version: '1.46.0'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v3
        with:
          node-version: 23.x

      - name: Ensure npm >= 11.7.0
        run: npm install -g npm@^11.7.0

      # The tag name and lib/package.json are set by the same recipe in the
      # same commit, so a disagreement means the tag was hand-made or moved.
      # Publishing then puts a version on npm that no tag describes, which is
      # exactly the state this whole flow exists to prevent.
      - name: resolve and verify version
        id: version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          TAG_VERSION="${TAG#v}"
          PKG_VERSION="$(jq -r '.version' lib/package.json)"

          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag $TAG says $TAG_VERSION but lib/package.json says $PKG_VERSION"
            exit 1
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$PKG_VERSION" >> $GITHUB_OUTPUT
          echo "✅ $TAG == lib/package.json $PKG_VERSION"

      - name: publish module
        run: |
          set -euo pipefail

          # `tee` rather than `OUTPUT=$(...)` so the log streams live, and no
          # `|| true`: a failing publish MUST fail the job. It used to be
          # swallowed, so a broken publish (e.g. a missing tool in the recipe)
          # reported success, silently skipped the release, and left the version
          # unpublished with a green check mark.
          if ! just lib/publish 2>&1 | tee publish.log; then
            echo "::error::'just lib/publish' failed - see the log above"
            exit 1
          fi

      # Belt and braces: the step above can only report what the recipe told it.
      # This asserts the actual end state against the registry, so any future
      # way of failing quietly still turns the job red.
      - name: verify version is on npm
        run: |
          set -euo pipefail
          NAME=$(jq -r '.name' lib/package.json)
          VERSION="${{ steps.version.outputs.version }}"

          # Registry reads can lag a publish, and `--prefer-online` is the
          # point of this loop: without it npm answers every attempt from the
          # packument it cached on the first one, so retrying re-reads the same
          # stale "not found" for the life of the cache entry and the whole
          # window is wasted. That is how 1.10.15 - published, tagged and on
          # the registry - was reported missing and failed the job.
          # 12 x 15s, because a cold publish has taken over a minute to appear.
          for attempt in $(seq 1 12); do
            if npm view --prefer-online "$NAME@$VERSION" version > /dev/null 2>&1; then
              echo "✅ $NAME@$VERSION is on npm"
              exit 0
            fi
            echo "$NAME@$VERSION not visible yet (attempt $attempt/12), retrying..."
            sleep 15
          done

          echo "::error::$NAME@$VERSION is not on npm after the publish step"
          exit 1

      # Confirms the tarball on the registry really carries the provenance
      # attestation this workflow asked for. Informational: a registry-side
      # hiccup here should not fail a release that is already published.
      - name: verify provenance signatures
        continue-on-error: true
        run: |
          set -euo pipefail
          NAME=$(jq -r '.name' lib/package.json)
          VERSION="${{ steps.version.outputs.version }}"
          rm -rf /tmp/sigcheck && mkdir -p /tmp/sigcheck
          cd /tmp/sigcheck
          npm init -y > /dev/null
          npm install --ignore-scripts "$NAME@$VERSION" > /dev/null
          npm audit signatures

      # Unconditional, and idempotent, by design. The old version of this step
      # was gated on "did we publish in this run?", so a re-run after a later
      # failure found the version already on npm, published nothing, and could
      # never create the release - v1.10.15 lost its release that way, for
      # good. The tag is what says "this version shipped": release whatever is
      # tagged and has no release yet.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi

          # The same tarball npm publishes, attached so the release is
          # self-contained even if the registry entry is later deprecated or
          # unpublished. `--json` rather than parsing stdout: `npm pack` also
          # writes a human file listing, and which stream each part lands on
          # has moved between npm versions.
          TARBALL=$(cd lib && npm pack --json --pack-destination "$GITHUB_WORKSPACE" | jq -r '.[0].filename')

          # Hand-written notes beat generated ones when they exist; `just
          # release` moved this version's changelog section under its number.
          # Fall back to commit-generated notes when the section is empty.
          just _changelog-section "$VERSION" > notes.md
          if [ -s notes.md ]; then
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file notes.md \
              --verify-tag \
              "$TARBALL"
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              --verify-tag \
              "$TARBALL"
          fi
          echo "✅ released $TAG"
